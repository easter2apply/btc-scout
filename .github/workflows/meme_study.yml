name: Meme Study
on:
  push:
    branches: [meme-lab]
    paths: [meme_study.py, .github/workflows/meme_study.yml]
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python meme_study.py
      - name: Save
        run: |
          git config user.name "meme-lab"
          git config user.email "meme-lab@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            cp meme_study.json /tmp/ms.json
            git fetch -q origin meme-lab && git reset -q --hard origin/meme-lab && cp /tmp/ms.json meme_study.json
            git add meme_study.json && git commit -qm "Meme Study output" && git push -q origin HEAD:meme-lab && exit 0
            sleep 5
          done
